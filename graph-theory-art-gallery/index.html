<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graph Theory Art Gallery | Sachal Abdullah</title>
    <meta name="description" content="A book of graph drawings: 685 plates from a notebook of uniquely Hamiltonian graphs.">
    <link rel="canonical" href="https://theoryculture.github.io/graph-theory-art-gallery/">
    <meta property="og:title" content="Graph Theory Art Gallery | Sachal Abdullah">
    <meta property="og:description" content="A book of graph drawings: vertices, edges, transitions, snarks.">
    <meta property="og:url" content="https://theoryculture.github.io/graph-theory-art-gallery/">
    <meta property="og:type" content="article">
    <meta name="copyright" content="© 2026 Sachal Abdullah. All rights reserved.">
    <link rel="stylesheet" href="/assets/main.css">
    <link rel="stylesheet" href="/assets/gallery-book.css">
</head>
<body class="page-gallery">

<header class="site-header">
    <a class="site-id" href="/">Sachal Abdullah</a>
    <nav class="site-nav" aria-label="Site">
        <a href="/research/">Research</a>
        <a href="/publications/">Publications</a>
        <a href="/mathematics/">Notes</a>
        <a href="/graph-theory-art-gallery/" aria-current="page">Gallery</a>
        <a href="/tutoring/">Teaching</a>
        <a href="/portfolio/">Portfolio</a>
        <a href="/contact/">Contact</a>
    </nav>
</header>

<main class="book-stage">
    <div class="stage-meta">
        <span>Graph theory art</span>
        <span>© 2026 Sachal Abdullah</span>
    </div>

    <div class="book-frame">
        <div class="reg-mark" aria-hidden="true"></div>
        <div class="crop-bl" aria-hidden="true"></div>
        <div class="crop-br" aria-hidden="true"></div>

        <nav class="thumbs" id="thumbs" aria-label="Parts"></nav>

        <div class="book" id="book" role="region" aria-label="Art book">
            <div class="page page-left" id="page-left"></div>
            <div class="spine" aria-hidden="true"></div>
            <div class="page page-right" id="page-right"></div>
            <div class="flipper" id="flipper" aria-hidden="true">
                <div class="flip-face flip-front" id="flip-front"></div>
                <div class="flip-face flip-back" id="flip-back"></div>
            </div>
        </div>
    </div>

    <div class="folio-bar">
        <button type="button" id="prev" aria-label="Previous page">←</button>
        <div class="folio-readout" aria-live="polite"><strong id="folio-label">Cover</strong></div>
        <button type="button" id="next" aria-label="Next page">→</button>
    </div>
    <input class="scrub" id="scrub" type="range" min="1" max="685" value="1" aria-label="Jump to plate">
    <p class="hint">Drag a page · arrows turn · click a plate to enlarge</p>
</main>

<div class="lightbox" id="lightbox" hidden role="dialog" aria-label="Plate">
    <a class="lb-pdf" id="lb-pdf" href="#">PDF</a>
    <button class="lb-close" id="lb-close" type="button">Close</button>
    <img id="lb-img" alt="">
</div>

<noscript>
    <p style="padding:2rem;color:#e8e2d6;font-family:monospace;">This gallery is a book. Enable JavaScript to turn the pages.</p>
</noscript>

<script src="/assets/gallery-catalog.js"></script>
<script src="/assets/gallery-book.js"></script>
</body>
</html>
